name: TradingView recursive Strategy Indicator one-shot crawl
on:
  workflow_dispatch:
concurrency:
  group: tradingview-recursive-once
  cancel-in-progress: false
jobs:
  recursive-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies and compilation
        run: |
          pip install requests beautifulsoup4
          python -m py_compile tools/tradingview_continual_discovery.py tools/tradingview_recursive_harvest.py
      - name: Restore 834 detail baseline, 473 author archive, and latest 11000 script master
        run: |
          mkdir -p source_catalog previous_authors previous_cycle
          gh run download 42424650043 -R lyonbegin/shared-n8n-studio -n tradingview-strategy-only-pages -D source_catalog
          gh run download 42431447503 -R lyonbegin/shared-n8n-studio -n all-authors-strategy-indicator-expansion -D previous_authors
          gh run download 42434951397 -R lyonbegin/shared-n8n-studio -n tradingview-continuous-catalog -D previous_cycle
          test -s previous_cycle/master.jsonl
          test -s previous_authors/all.jsonl
      - name: Test recursive crawling on a small real author sample
        run: |
          python tools/tradingview_recursive_harvest.py --skip-feeds --test-authors 3 --delay 1 --output sample_check || test $? -eq 1
          python -c 'import json; m=json.load(open("sample_check/manifest.json")); assert m["authors_processed"] >= 3 and m["strategies"] >= 1711 and m["indicators"] >= 9289, m'
      - name: Crawl all discovered authors recursively until queue is empty
        run: |
          python tools/tradingview_recursive_harvest.py --page-limit 200 --delay 1.3 --checkpoint-every 25 --max-runtime 18500 --output tradingview_recursive_output
      - name: Upload cumulative catalog, checkpoint, and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-recursive-final-or-checkpoint
          path: tradingview_recursive_output/
          retention-days: 90
          if-no-files-found: warn
