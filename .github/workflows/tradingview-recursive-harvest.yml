name: TradingView recursive Strategy Indicator one-shot crawl
on:
  push:
    paths:
      - "tools/tradingview_recursive_harvest.py"
      - ".github/workflows/tradingview-recursive-harvest.yml"
  workflow_dispatch:
concurrency:
  group: tradingview-recursive-once
  cancel-in-progress: true
jobs:
  recursive-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies and compilation
        run: |
          pip install requests beautifulsoup4
          python -m py_compile tools/tradingview_continual_discovery.py tools/tradingview_recursive_harvest.py
      - name: Restore prior Strategy, Indicator and all verified author coverage
        run: |
          mkdir -p source_catalog previous_authors previous_recursive
          gh run download 42424650043 -R lyonbegin/shared-n8n-studio -n tradingview-strategy-only-pages -D source_catalog
          gh run download 42431447503 -R lyonbegin/shared-n8n-studio -n all-authors-strategy-indicator-expansion -D previous_authors
          gh run download 42443014922 -R lyonbegin/shared-n8n-studio -n tradingview-recursive-final-or-checkpoint -D previous_recursive
          test -s previous_recursive/master.jsonl
          test -s previous_recursive/author_coverage.jsonl
          test -s previous_authors/all.jsonl
      - name: Live validate Editors Picks, Followed Authors, and id parsing
        run: |
          python - <<'PY'
          import requests
          from tools.tradingview_recursive_harvest import listing_scan, script_id, TOPIC_PATHS
          assert len(TOPIC_PATHS) == 17, TOPIC_PATHS
          assert script_id("https://www.tradingview.com/script/ERScIMjp/") == "ERScIMjp"
          assert script_id("https://www.tradingview.com/script/u1L7iXmp-title/") == "u1L7iXmp"
          session = requests.Session()
          errors = []
          found, pages = listing_scan(session, "editors-picks", 2, 1, errors)
          assert len(found) >= 24, (len(found), pages, errors)
          assert any(x.get("author") and x.get("type") in ("strategy","indicator") for x in found), found[:2]
          followed, follow_pages = listing_scan(session, "followed-authors", 1, 1, errors)
          assert not errors, errors
          assert followed or any(x.get("status") == "requires_authentication" for x in follow_pages), follow_pages
          for slug in ("xauusd", "indicators", "strategy", "zigzag"):
              topic_found, topic_pages = listing_scan(session, "topic:" + slug, 1, 1, errors)
              assert topic_found and any(x.get("author") for x in topic_found), (slug, topic_pages, errors)
              print("TOPIC_TEST_OK", slug, len(topic_found), flush=True)
          assert not errors, errors
          print("SOURCE_TEST_OK", len(found), len(followed), follow_pages, flush=True)
          PY
      - name: Crawl all discovered authors recursively until queue is empty
        run: |
          python tools/tradingview_recursive_harvest.py --latest previous_recursive/master.jsonl --processed-authors-file previous_recursive/author_coverage.jsonl --page-limit 200 --delay 1.3 --checkpoint-every 25 --max-runtime 18500 --output tradingview_recursive_output
      - name: Upload cumulative catalog, checkpoint, and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-recursive-final-or-checkpoint
          path: tradingview_recursive_output/
          retention-days: 90
          if-no-files-found: warn
