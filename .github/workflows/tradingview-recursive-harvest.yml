name: TradingView recursive Strategy Indicator one-shot crawl
on:
  push:
    paths:
      - "tools/tradingview_recursive_harvest.py"
      - ".github/workflows/tradingview-recursive-harvest.yml"
  workflow_dispatch:
concurrency:
  group: tradingview-recursive-once
  cancel-in-progress: false
jobs:
  recursive-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies and compilation
        run: |
          pip install requests beautifulsoup4
          python -m py_compile tools/tradingview_continual_discovery.py tools/tradingview_recursive_harvest.py tools/tradingview_notify_mail.py
      - name: Restore 834 detail baseline, 473 author archive, and latest 11000 script master
        run: |
          mkdir -p source_catalog previous_authors previous_cycle
          gh run download 42424650043 -R lyonbegin/shared-n8n-studio -n tradingview-strategy-only-pages -D source_catalog
          gh run download 42431447503 -R lyonbegin/shared-n8n-studio -n all-authors-strategy-indicator-expansion -D previous_authors
          gh run download 42434951397 -R lyonbegin/shared-n8n-studio -n tradingview-continuous-catalog -D previous_cycle
          test -s previous_cycle/master.jsonl
          test -s previous_authors/all.jsonl
      - name: Test recursive crawling on a small real author sample
        run: |
          python tools/tradingview_recursive_harvest.py --skip-feeds --test-authors 3 --delay 1 --output sample_check || test $? -eq 1
          python -c 'import json; m=json.load(open("sample_check/manifest.json")); assert m["authors_processed"] >= 3 and m["strategies"] >= 1711 and m["indicators"] >= 9289, m'
      - name: Crawl all discovered authors recursively until queue is empty
        run: |
          python tools/tradingview_recursive_harvest.py --page-limit 200 --delay 1.3 --checkpoint-every 25 --max-runtime 18500 --output tradingview_recursive_output
      - name: Upload cumulative catalog, checkpoint, and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-recursive-final-or-checkpoint
          path: tradingview_recursive_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Send completed-recursion email if SMTP secrets configured
        if: always()
        env:
          TV_MANIFEST: tradingview_recursive_output/manifest.json
          TV_SMTP_HOST: ${{ secrets.TV_SMTP_HOST }}
          TV_SMTP_PORT: ${{ secrets.TV_SMTP_PORT }}
          TV_SMTP_USER: ${{ secrets.TV_SMTP_USER }}
          TV_SMTP_PASSWORD: ${{ secrets.TV_SMTP_PASSWORD }}
          TV_REPORT_EMAIL: ${{ secrets.TV_REPORT_EMAIL }}
        run: python tools/tradingview_notify_mail.py
      - name: Create GitHub notification if email is not configured
        if: always()
        env:
          SMTP_HOST: ${{ secrets.TV_SMTP_HOST }}
          SMTP_USER: ${{ secrets.TV_SMTP_USER }}
          SMTP_PASS: ${{ secrets.TV_SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.TV_REPORT_EMAIL }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path("tradingview_recursive_output/manifest.json")
          if not p.exists():raise SystemExit(0)
          m=json.loads(p.read_text(encoding="utf-8"))
          if m["state"]!="FRONTIER_EXHAUSTED":raise SystemExit(0)
          if all(os.getenv(k) for k in ("SMTP_HOST","SMTP_USER","SMTP_PASS","SMTP_TO")):raise SystemExit(0)
          title=f"[TradingView] 재귀 수집 종료: Strategy {m['strategies']} / Indicator {m['indicators']}"
          body=(f"신규 제작자 대기열 종료. Strategy {m['strategies']}, Indicator {m['indicators']}, 오류 {m['error_count']}.\n"
                f"Actions: https://github.com/lyonbegin/shared-n8n-studio/actions/runs/{os.getenv('GITHUB_RUN_ID')}\n"
                "SMTP secrets not configured, so email could not be sent; GitHub assignment notification is a fallback.\n")
          subprocess.run(["gh","issue","create","-R","lyonbegin/shared-n8n-studio","-t",title,"-b","".join(body),"-a","lyonbegin"],check=True)
          print("GITHUB_ISSUE_NOTIFICATION_CREATED; DIRECT_EMAIL_NOT_CONFIGURED")
          PY
