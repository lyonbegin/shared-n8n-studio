name: WF01+WF02 deployed VueFlow + SQLite E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'playground/tests/wf01-live-sqlite.spec.js'
      - 'playground/tests/wf01-detailed-editor.spec.js'
      - 'playground/tests/wf02-live-sqlite.spec.js'
      - 'playground/tests/wf01-one-per-mode.spec.js'
      - 'playground/tests/wf01-node01-python.spec.js'
      - 'playground/playwright.wf01.live.config.js'
      - '.github/workflows/wf01-live-sqlite.yml'
  push:
    branches: [feature/wf01-canvas-20261029]
    paths:
      - 'playground/tests/wf01-live-sqlite.spec.js'
      - 'playground/tests/wf01-detailed-editor.spec.js'
      - 'playground/tests/wf02-live-sqlite.spec.js'
      - 'playground/tests/wf01-one-per-mode.spec.js'
      - 'playground/tests/wf01-node01-python.spec.js'
      - 'playground/playwright.wf01.live.config.js'
      - '.github/workflows/wf01-live-sqlite.yml'
jobs:
  editor-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for WF02 fixture on deployed Railway editor
        run: |
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 12 'https://investment-n8n-native-editor-production.up.railway.app/api/studio/workflows/operations/WF02-pine-to-python.json' | python3 -c 'import json,sys; w=json.load(sys.stdin)["workflow"]; assert len(w["nodes"])==48'; then
              echo 'WF02 deployed fixture available'; break
            fi
            if [ "$attempt" -eq 50 ]; then echo 'WF02 fixture not deployed'; exit 1; fi
            sleep 8
          done
      - name: Wait for the two new dedicated workflows in Railway
        run: |
          for kind in strategy library; do
            for attempt in $(seq 1 45); do
              if curl -fsS --max-time 10 "https://investment-n8n-native-editor-production.up.railway.app/api/studio/workflows/operations/WF01-latest-${kind}-one.json" | python3 -c 'import json,sys; obj=json.load(sys.stdin)["workflow"]; assert len(obj["nodes"])==16'; then
                echo "WF01 ${kind} fixture available"
                break
              fi
              if [ "$attempt" -eq 45 ]; then echo "${kind} not deployed"; exit 1; fi
              sleep 8
            done
          done
      - name: N01 Python source compile and real handler contract
        run: |
          python3 -m py_compile ../server/studio_server.py ../server/wf01_node_executor.py
          PYTHONPATH=../server python3 - <<'PY'
          from wf01_node_executor import execute_node01
          for kind in ('strategy','library'):
              out = execute_node01({'ui_selection':kind,'requested_detail_limit':1},workflow_kind=kind)
              assert out['kind'] == kind and out['max_detail_success'] == 1
              assert out['tradingview_requested'] is False
              for data in ({'ui_selection':kind,'requested_detail_limit':2},
                           {'ui_selection':kind,'requested_detail_limit':True}):
                  try:
                      execute_node01(data,workflow_kind=kind)
                      raise AssertionError('bad input accepted')
                  except ValueError:
                      pass
          PY
      - name: Wait for Railway N01 Python execution deployment
        run: |
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 10 'https://investment-n8n-native-editor-production.up.railway.app/api/studio/health' | python3 -c 'import json,sys; assert json.load(sys.stdin).get("node01ExecutionEnabled") is True'; then
              echo 'N01 backend Python executor is live'
              break
            fi
            if [ "$attempt" -eq 50 ]; then echo 'N01 Python runtime not deployed'; exit 1; fi
            sleep 8
          done
      - name: Actual production VueFlow and per-browser SQLite persistence
        run: npx playwright test --config=playwright.wf01.live.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wf01-live-sqlite-evidence
          path: |
            playground/test-results/
            playground/playwright-report/
          retention-days: 7
