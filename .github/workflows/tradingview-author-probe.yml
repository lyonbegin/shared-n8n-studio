name: TradingView author profile discovery probe
on:
  push:
    paths:
      - "tools/tradingview_author_probe.py"
      - ".github/workflows/tradingview-author-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python tools/tradingview_author_probe.py
