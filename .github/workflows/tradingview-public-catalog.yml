name: TradingView public catalog archive
on:
  push:
    paths:
      - ".github/workflows/tradingview-public-catalog.yml"
      - "tools/tradingview_catalog_collect.py"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Pages per category
        default: '100'
        required: false
      max_details:
        description: Maximum script detail pages
        default: '10000'
        required: false
jobs:
  collect-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parsers
        run: pip install requests beautifulsoup4
      - name: Collect unfiltered public listing and full script descriptions
        run: |
                    if [ "${{ github.event_name }}" = "push" ]; then
            MAX_PAGES=2; MAX_DETAILS=40
          else
            MAX_PAGES="${{ inputs.max_pages }}"; MAX_DETAILS="${{ inputs.max_details }}"
          fi
          python tools/tradingview_catalog_collect.py --max-pages "$MAX_PAGES" --max-details "$MAX_DETAILS" --delay 2.5 --output tradingview_catalog_output
      - name: Upload collected raw records and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-public-scripts-with-descriptions
          path: tradingview_catalog_output/
          retention-days: 30
          if-no-files-found: warn
