name: TradingView Strategy-only full-description collection
on:
  push:
    paths:
      - "tools/tradingview_catalog_collect.py"
      - ".github/workflows/tradingview-public-catalog.yml"
  workflow_dispatch:
    inputs:
      start_page:
        description: "First TradingView Strategy listing page"
        required: false
        default: "1"
      page_count:
        description: "Number of Strategy listing pages"
        required: false
        default: "200"
jobs:
  strategy-first-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Crawl first three Strategy listing pages and ALL discovered details
        run: |
          python tools/tradingview_catalog_collect.py --start-page 1 --max-pages 3 --delay 1.3 --output tradingview_strategy_first_batch
          python -c "import json; m=json.load(open('tradingview_strategy_first_batch/manifest.json')); assert m['discovered_unique']>0 and m['details_attempted']==m['discovered_unique'],m"
      - name: Upload first strategy-only archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-strategy-first-3-pages
          path: tradingview_strategy_first_batch/
          retention-days: 30
          if-no-files-found: warn
  strategy-pages-collection:
    needs: strategy-first-batch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Discover Strategy pages and download ALL discovered descriptions
        env:
          START_PAGE: ${{ inputs.start_page || '1' }}
          PAGE_COUNT: ${{ inputs.page_count || '200' }}
        run: |
          python tools/tradingview_catalog_collect.py --start-page "$START_PAGE" --max-pages "$PAGE_COUNT" --delay 2.5 --output tradingview_strategy_catalog
          python -c "import json; m=json.load(open('tradingview_strategy_catalog/manifest.json')); assert m['details_attempted']==m['discovered_unique'],m"
      - name: Upload strategy-only corpus and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-strategy-only-pages
          path: tradingview_strategy_catalog/
          retention-days: 30
          if-no-files-found: warn
