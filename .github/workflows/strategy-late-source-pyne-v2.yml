name: Strategy 4428 late recovered Pine isolated PYNE v2
on:
  push:
    branches: [sandbox/strategy4428-gap-recovery-20261109]
    paths:
      - recovery/legacy_version_repair_v2_late_sources.py
      - .github/workflows/strategy-late-source-pyne-v2.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-late:
    name: Recover last-source shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    env:
      GH_TOKEN: ${{ github.token }}
      WF02_ADAPTER_DIR: /tmp/wf02-isolated/n8n/editor-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed free compiler
        run: |
          python -m venv .pyne-venv
          .pyne-venv/bin/python -m pip install 'hoox-pyne[compile]==0.6.31'
      - name: Clone isolated WF02 source only
        run: |
          git clone --depth 1 --branch sandbox/wf02-pine-library-isolated-20261109 \
            https://github.com/lyonbegin/autonomous-investor-backend.git /tmp/wf02-isolated
      - name: Restore final 3455 immutable original source and compare last recovery audit
        run: |
          mkdir -p latest_sources latest_audit prior_audit
          gh run download 42586717657 -R lyonbegin/shared-n8n-studio \
            -n strategy4428-final-public-pine-source-packages-v2 -D latest_sources
          gh run download 42586717657 -R lyonbegin/shared-n8n-studio \
            -n strategy4428-final-public-source-recovery-report-v2 -D latest_audit
          gh run download 42586306099 -R lyonbegin/shared-n8n-studio \
            -n strategy4428-official-recovery-and-pyne-full-audit -D prior_audit
          test -f latest_audit/all_4428_recovery_status.csv
          test -f prior_audit/strategy4428_all_pipeline_status.csv
      - name: Compile late open originals with source SHA and exact 4428 IDs
        run: |
          source .pyne-venv/bin/activate
          python -m py_compile recovery/legacy_version_repair_v2_late_sources.py
          python recovery/legacy_version_repair_v2_late_sources.py \
            --prior-audit prior_audit/strategy4428_all_pipeline_status.csv \
            --latest-audit latest_audit/all_4428_recovery_status.csv \
            --sources latest_sources \
            --output late_result_${{ matrix.shard }} \
            --shards 4 --shard ${{ matrix.shard }} --timeout 25
      - name: Verify hashes and prohibit unsupported equivalence claims
        run: |
          python - <<'PY'
          import ast,hashlib,json
          from pathlib import Path
          out=Path('late_result_${{ matrix.shard }}/compiled')
          rows=json.loads((out/'results.json').read_text())
          for row in rows:
            assert row['parity_verified'] is False
            if not row['python_sha256']: continue
            p=out/'strategies'/row['script_id']/'generated.py'
            assert p.is_file()
            assert hashlib.sha256(p.read_bytes()).hexdigest()==row['python_sha256']
            ast.parse(p.read_text())
          print('LATE_SOURCE_SHA_AND_PYTHON_AST_VERIFIED',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy4428-late-original-v2-${{ matrix.shard }}
          path: late_result_${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: warn
