name: Audit 960 restricted Strategy public source evidence
on:
  push:
    branches: [sandbox/strategy960-public-source-evidence-20261109]
    paths:
      - 'recovery/strategy960_public_visibility_audit.py'
      - 'recovery/aggregate_strategy960_public_evidence.py'
      - '.github/workflows/strategy960-author-source-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: strategy960-public-evidence-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Public page metadata shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore the audited 4428 Strategy catalog
        run: |
          mkdir -p source_4428
          gh run download 42567572031 -R lyonbegin/shared-n8n-studio \
            -n strategy-4428-pine-source-result -D source_4428
          test -f source_4428/strategy_4428_result/strategy_4428_source_status.csv
      - name: Audit only ordinary public HTML and record author links
        run: |
          python recovery/strategy960_public_visibility_audit.py \
            --input source_4428/strategy_4428_result/strategy_4428_source_status.csv \
            --output shard-${{ matrix.shard }} \
            --shard ${{ matrix.shard }} --shards 4 --delay 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy960-audit-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    name: Verify 960 distinct Strategy evidence records
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: strategy960-audit-shard-*
          path: collected
          merge-multiple: false
      - name: Merge and assert precisely 452 protected and 508 invite-only
        run: python recovery/aggregate_strategy960_public_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy960-public-access-and-author-source-queue
          path: strategy960_final/
          retention-days: 30
          if-no-files-found: warn
